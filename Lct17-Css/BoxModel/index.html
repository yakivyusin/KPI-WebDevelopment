<html>
<head>
    <title>Box Model</title>
    <style>
        body {
            margin-left: 25%;
            margin-right: 25%;
        }

        div {
            background-color: antiquewhite;
        }

        .box {
            width: 350px;
            height: 150px;
            margin: 10px;
            padding: 25px;
            border: 4px solid black;
            background-color: aliceblue;
        }

        .box:nth-child(2) {
            box-sizing: border-box;
        }

        .box > span {
            background-color: aquamarine;
        }

        .box:nth-child(3) > span {
            display: inline-block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div>
        <p class="box"><span>Box</span></p>
        <p class="box"><span>Box</span></p>
        <p class="box"><span>Inline-block span</span></p>
    </div>
</body>
</html>
